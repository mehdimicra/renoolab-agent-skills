name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm test
      - run: npm run validate:skills-ref
      - name: Validate Claude plugin strictly
        run: npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate --strict .
      - name: Validate GitHub Agent Skills publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run .
      - name: Ensure generation is committed
        run: git diff --exit-code